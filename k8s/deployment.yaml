apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: inventario
  template:
    metadata:
      labels:
        app: inventario
    spec:
      containers:
      - name: inventario-container
        image: ghcr.io/raet0/inventario-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        # --- COMPONENTE 1: MANEJO DE SECRETOS Y COMPONENTE 3: ARRANQUE LENTO ---
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: API_KEY
        - name: STARTUP_DELAY_SECONDS
          value: "30" # La app esperará 30 segundos antes de ponerse lista
        # --- PROBES DE SALUD ---
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10 # Tolera hasta 10 fallos (50s total) para dar tiempo a los 30s de retardo
