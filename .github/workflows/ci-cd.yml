name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  build-push:
    needs: build-test # principle fail-fast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permisos para publicar en ghcr.io

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CÓDIGO ANTERIOR CON ERROR (Comentado para demostración):
      # # --- COMPONENTE 2: ESCANEO DE SEGURIDAD CON TRIVY ---
      # - name: Escaneo de vulnerabilidades con Trivy
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: 'ghcr.io/raet0/inventario-app:${{ github.sha }}'
      #     format: 'table'
      #     exit-code: '1' # Falla el pipeline si encuentra vulnerabilidades de severidad CRITICAL
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL'
      #
      # - name: Construir y publicar imagen Docker
      #   uses: docker/build-push-action@v4
      #   with:
      #     context: .
      #     push: true
      #     tags: |
      #       ghcr.io/raet0/inventario-app:${{ github.sha }}
      #       ghcr.io/raet0/inventario-app:latest

      # Codigo que permite pasar la prueba:
      # 1. Construir la imagen pero dejarla en el Docker local (load: true)
      - name: Construir imagen Docker localmente
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true # <-- Esto es clave: carga la imagen localmente en vez de subirla
          tags: ghcr.io/raet0/inventario-app:${{ github.sha }}

      # 2. COMPONENTE 2: Escanear la imagen que acabamos de construir localmente
      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/raet0/inventario-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Falla el pipeline si encuentra vulnerabilidades de severidad CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # 3. Si Trivy pasó con éxito, ahora sí la subimos al registro (push: true)
      - name: Publicar imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/raet0/inventario-app:${{ github.sha }}
            ghcr.io/raet0/inventario-app:latest
