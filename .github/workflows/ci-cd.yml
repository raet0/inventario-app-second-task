name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  build-push:
    needs: build-test # principle fail-fast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permisos para publicar en ghcr.io

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- COMPONENTE 2: ESCANEO DE SEGURIDAD CON TRIVY ---
      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/raet0/inventario-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Falla el pipeline si encuentra vulnerabilidades de severidad CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/raet0/inventario-app:${{ github.sha }}
            ghcr.io/raet0/inventario-app:latest
